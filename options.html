<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phraselet Options</title>
    <link rel="stylesheet" href="src/shared.css">
    <script src="src/options.js" type="module"></script>
  </head>
  <body class="options-shell">
    <header class="options-topbar">
      <div class="brand-lockup brand-link">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Phraselet</span>
      </div>
      <span class="page-label">Settings</span>
    </header>

    <main class="options-layout">
      <section class="options-intro" aria-labelledby="options-title">
        <p class="eyebrow">Preferences</p>
        <h1 id="options-title">Set up<br>Phraselet.</h1>
        <p>Choose what happens after each capture and manage your keyboard shortcut.</p>

        <div class="shortcut-card" aria-label="Save selection keyboard shortcut">
          <span class="shortcut-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <div>
            <span>Save any selection</span>
            <small>Long selections are shortened to 500 characters</small>
          </div>
          <kbd data-shortcut-label>Alt/⌥ ⇧ P</kbd>
        </div>
        <div class="options-help-actions">
          <button id="change-shortcut" class="text-button onboarding-link" type="button">Change shortcut</button>
          <button id="view-onboarding" class="text-button onboarding-link" type="button">View welcome guide</button>
        </div>
      </section>

      <section class="options-panel" aria-label="Phraselet preferences">
        <div id="enrichment-settings-slot"></div>

        <div class="settings-section">
          <div class="section-heading">
            <span id="capture-section-number" class="section-number">01</span>
            <div>
              <h2>Capture behavior</h2>
              <p>Decide what you see after saving a phrase.</p>
            </div>
          </div>

          <div class="field-group">
            <label for="after-save">After saving</label>
            <select id="after-save">
              <option value="confirmation">Show a quiet confirmation</option>
              <option value="open_popup">Open my phrase library</option>
            </select>
          </div>
        </div>

        <div class="options-footer">
          <p id="status" class="status-line" role="status" aria-live="polite"></p>
          <div id="settings-actions" class="actions-row">
            <button id="save-options" class="primary-button" type="button">
              Save preferences
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
