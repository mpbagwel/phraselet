<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pausemark</title>
    <link rel="stylesheet" href="src/shared.css">
    <script src="src/popup.js" defer></script>
  </head>
  <body class="popup-shell">
    <header class="topbar">
      <div>
        <h1>Pausemark</h1>
        <p id="card-count">No saved phrases yet</p>
      </div>
      <button id="open-options" class="icon-button" type="button" title="Options" aria-label="Options">...</button>
    </header>

    <section class="capture-row">
      <button id="save-selection" class="primary-button" type="button">Save selection</button>
      <input id="search" type="search" placeholder="Search saved phrases" autocomplete="off">
    </section>

    <section class="filter-row">
      <label for="tag-filter">Tag</label>
      <select id="tag-filter" aria-label="Filter by tag">
        <option value="">All tags</option>
      </select>
    </section>

    <section class="library-actions">
      <button id="export-cards" class="secondary-button" type="button">Export</button>
      <button id="import-cards" class="secondary-button" type="button">Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="library-status" class="status-line" role="status"></p>
    </section>

    <main id="cards" class="cards" aria-live="polite"></main>
  </body>
</html>
