<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phraselet bulk actions screenshot</title><link rel="stylesheet" href="../../src/shared.css?v=release"><link rel="stylesheet" href="store.css"></head>
  <body class="bulk-demo">
    <main class="stage">
      <div class="browser-bar" aria-hidden="true"><span class="browser-dots"><i></i><i></i><i></i></span><div class="address"></div></div>
      <div class="demo-note"></div>
      <div class="popup-wrap">
        <section class="popup-shell popup-mock">
          <header class="topbar popup-topbar"><div class="brand-lockup"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><div><h1>Phraselet</h1><p>12 saved phrases</p></div></div><div class="popup-header-actions"><button class="primary-button quick-capture-button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Save</span></button><button class="icon-button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.5c.05-.32.1-.66.1-1s-.04-.68-.1-1l2.1-1.64-2-3.46-2.47 1a7.7 7.7 0 0 0-1.73-1L14.92 3h-4l-.38 2.4c-.62.25-1.2.59-1.73 1l-2.47-1-2 3.46 2.1 1.64c-.06.32-.1.66-.1 1s.04.68.1 1l-2.1 1.64 2 3.46 2.47-1c.53.42 1.11.75 1.73 1l.38 2.4h4l.38-2.4c.62.25 1.2-.58 1.73-1l2.47 1 2-3.46-2.1-1.64Z"/></svg></button></div></header>
          <section class="command-panel"><div class="search-field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input placeholder="Search phrases, notes, or context…"></div></section>
          <div class="library-toolbar"><section class="filter-row"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><select><option>All tags</option></select><button id="manage-tag" class="text-button" disabled>Edit tag</button><select id="view-filter"><option>Current</option></select></section><section class="library-actions"><button class="text-button selection-toggle" aria-pressed="true">Done</button><button class="icon-button small-icon-button"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v5h14v-5"/></svg></button><button class="icon-button small-icon-button"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8M5 15v5h14v-5"/></svg></button></section></div>
          <section class="bulk-actions"><div class="bulk-selection-row"><label><input type="checkbox" checked> Select all matching</label><strong>3 selected</strong><button class="text-button">Clear</button></div><div class="bulk-tag-row"><input value="review" aria-label="Tag"><button class="secondary-button">Add</button><button class="secondary-button">Remove</button></div><div class="bulk-export-row"><button class="secondary-button">Copy phrases</button><select aria-label="Export format"><option>Markdown</option></select><button class="secondary-button">Export</button></div><div class="bulk-state-row"><button class="secondary-button">Archive</button><button class="secondary-button" disabled>Restore</button><button class="danger-button">Delete</button></div></section>
          <section class="cards">
            <article class="phrase-card is-selected"><div class="card-header"><div class="card-title-row"><label class="card-selector"><input type="checkbox" checked></label><h2>Attention is the beginning of devotion.</h2></div></div><div class="tag-list"><button class="tag-chip">reading</button></div></article>
            <article class="phrase-card is-selected"><div class="card-header"><div class="card-title-row"><label class="card-selector"><input type="checkbox" checked></label><h2>What we pay attention to grows.</h2></div></div><div class="tag-list"><button class="tag-chip">attention</button></div></article>
          </section>
        </section>
      </div>
    </main>
  </body>
</html>
